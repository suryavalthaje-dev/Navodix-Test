function toast(msg,type='success'){
 const backdrop=document.getElementById('modalBackdrop');
 const footer=document.getElementById('modalFooter');
 if(backdrop && backdrop.classList.contains('show') && footer){
   let feedback=document.getElementById('modalFeedback');
   if(!feedback){feedback=document.createElement('div');feedback.id='modalFeedback';footer.prepend(feedback);}
   feedback.className='modal-feedback '+(type==='error'?'error':'success');
   feedback.textContent=(type==='error'?'! ':'✓ ')+msg;
   clearTimeout(window.modalFeedbackTimer);
   window.modalFeedbackTimer=setTimeout(()=>{if(feedback.isConnected)feedback.remove()},5000);
   return;
 }
 let t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;
 clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.className='toast',3200);
}
function badge(s){let v=String(s||'').toLowerCase(),c=v.includes('pending')?'pending':v.includes('reject')?'rejected':v.includes('paid')||v.includes('settled')||v==='active'?'paid':v.includes('draft')?'draft':v.includes('reversed')?'reversed':v.includes('initiated')?'initiated':'';return `<span class="status ${c}">${s}</span>`}

function renderInvoiceLineRows(){return invoiceLineItems.map((x,i)=>`<tr><td><input class="line-desc" id="ivDesc${i}" value="${escapeHtml(x.description)}" placeholder="e.g. L1 Monitoring Engineer – Monthly Services" oninput="invoiceLineItems[${i}].description=this.value"></td><td><input id="ivQty${i}" type="number" min="0.01" step="0.01" value="${x.quantity}" oninput="invoiceLineItems[${i}].quantity=Number(this.value)||0;calculateInvoice()"></td><td><input id="ivRate${i}" type="number" min="0" step="0.01" value="${x.rate}" oninput="invoiceLineItems[${i}].rate=Number(this.value)||0;calculateInvoice()"></td><td style="white-space:nowrap;font-weight:650" id="ivLineAmount${i}">${money(x.quantity*x.rate)}</td><td><button class="action-link" onclick="removeInvoiceLine(${i})" ${invoiceLineItems.length===1?'disabled':''}>Remove</button></td></tr>`).join('')}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addInvoiceLine(){syncInvoiceLines();invoiceLineItems.push({description:'',quantity:1,rate:0});document.getElementById('invoiceLines').innerHTML=renderInvoiceLineRows();calculateInvoice()}
function removeInvoiceLine(i){syncInvoiceLines();if(invoiceLineItems.length===1)return;invoiceLineItems.splice(i,1);document.getElementById('invoiceLines').innerHTML=renderInvoiceLineRows();calculateInvoice()}
function syncInvoiceLines(){invoiceLineItems=invoiceLineItems.map((x,i)=>({description:document.getElementById('ivDesc'+i)?.value??x.description,quantity:Number(document.getElementById('ivQty'+i)?.value??x.quantity)||0,rate:Number(document.getElementById('ivRate'+i)?.value??x.rate)||0}))}
function invoiceTotals(){syncInvoiceLines();let subtotal=invoiceLineItems.reduce((a,x)=>a+x.quantity*x.rate,0),raw=Number(document.getElementById('ivDiscount')?.value)||0,type=document.getElementById('ivDiscountType')?.value||'amount',discount=type==='percent'?subtotal*Math.min(100,Math.max(0,raw))/100:Math.min(subtotal,Math.max(0,raw));return {subtotal,discount,total:Math.max(0,subtotal-discount)}}
function calculateInvoice(){let t=invoiceTotals();invoiceLineItems.forEach((x,i)=>{let el=document.getElementById('ivLineAmount'+i);if(el)el.textContent=money(x.quantity*x.rate)});let a=document.getElementById('ivSubtotal'),b=document.getElementById('ivDiscountTotal'),c=document.getElementById('ivGrandTotal');if(a)a.textContent=money(t.subtotal);if(b)b.textContent=money(t.discount);if(c)c.textContent=money(t.total)}
function invoiceClientChanged(){let c=clients.find(x=>x.id===document.getElementById('ivClient').value);if(!c)return;document.getElementById('ivAddress').value=[c.billingAddress,c.city,c.state,c.pin,c.country].filter(Boolean).join(', ');document.getElementById('ivGstin').value=c.gstin||'—';document.getElementById('ivPan').value=c.pan||'—';document.getElementById('ivTerms').value=c.paymentTerms??invoiceSettings.paymentTerms;updateInvoiceDueDate()}
function updateInvoiceDueDate(){let d=document.getElementById('ivDate')?.value,days=Number(document.getElementById('ivTerms')?.value)||0;if(!d)return;let date=new Date(d+'T00:00:00');date.setDate(date.getDate()+days);document.getElementById('ivDue').value=date.toISOString().slice(0,10)}
function collectInvoice(){syncInvoiceLines();let client=clients.find(c=>c.id===document.getElementById('ivClient')?.value),date=document.getElementById('ivDate')?.value,terms=Number(document.getElementById('ivTerms')?.value),items=invoiceLineItems.map(x=>({...x})),totals=invoiceTotals();if(!client){toast('Select an active client.','error');return null}if(!date){toast('Enter the invoice date.','error');return null}if(items.some(x=>!x.description.trim()||x.quantity<=0||x.rate<0)||!items.length){toast('Complete each item description, quantity and rate.','error');return null}if(totals.total<=0){toast('Invoice total must be greater than zero.','error');return null}let due=new Date(date+'T00:00:00');due.setDate(due.getDate()+Math.max(0,terms));return {clientId:client.id,client:client.displayName||client.legalName,clientSnapshot:{...client},date,due:due.toISOString().slice(0,10),terms,items,subtotal:totals.subtotal,discount:totals.discount,total:totals.total,notes:document.getElementById('ivNotes').value.trim(),termsText:document.getElementById('ivTermsText').value.trim()}}
function saveInvoiceDraft(){let d=collectInvoice();if(!d)return;let existing=demoInvoices.find(x=>x.status==='Draft'&&x.editingDraft);if(existing)Object.assign(existing,d);else demoInvoices.push({...d,number:'DRAFT-'+String(demoInvoices.filter(x=>x.status==='Draft').length+1).padStart(3,'0'),received:0,balance:d.total,status:'Draft',age:'Not yet issued',editingDraft:false});toast('Invoice saved as a draft in this prototype.');setPage('Invoice Dashboard')}
function nextInvoiceNumber(){let prefix=invoiceSettings.prefix||'NAV',date=new Date(document.getElementById('ivDate').value+'T00:00:00'),fyStart=invoiceSettings.financialYearStart==='January'?0:3,startYear=date.getFullYear()-(date.getMonth()<fyStart?1:0),fy=String(startYear).slice(-2)+'-'+String(startYear+1).slice(-2),existing=demoInvoices.filter(x=>x.number&&x.number.startsWith(prefix+'/'+fy+'/')).map(x=>Number(x.number.split('/').pop())||0),n=Math.max(Number(invoiceSettings.nextNumber)||1,...existing.map(v=>v+1));return `${prefix}/${fy}/${String(n).padStart(3,'0')}`}
function issueInvoice(){let d=collectInvoice();if(!d)return;if(!confirm('Issue this Commercial Invoice? An invoice number will be assigned and the issued record should not be edited directly.'))return;let number=nextInvoiceNumber();demoInvoices.unshift({...d,number,received:0,balance:d.total,status:'Issued',age:'Due '+new Date(d.due+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short'}),issuedAt:new Date().toISOString(),issuedBy:currentDirector});toast('Invoice '+number+' issued in the prototype.');setPage('Invoice Dashboard')}
function invoiceDateLabel(value){if(!value)return '—';let d=/^\d{4}-\d{2}-\d{2}$/.test(value)?new Date(value+'T00:00:00'):new Date(value);return isNaN(d.getTime())?escapeHtml(value):d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function invoiceWords(n){n=Math.round(Number(n)||0);if(!n)return 'Zero';const one=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],ten=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];function under(x){if(x<20)return one[x];if(x<100)return ten[Math.floor(x/10)]+(x%10?' '+one[x%10]:'');return one[Math.floor(x/100)]+' Hundred'+(x%100?' '+under(x%100):'')}let out=[];[['Crore',10000000],['Lakh',100000],['Thousand',1000],['Hundred',100]].forEach(([label,v])=>{if(n>=v){let q=Math.floor(n/v);out.push(under(q)+' '+label);n%=v}});if(n)out.push(under(n));return out.join(' ')}
function invoiceDocumentHtml(d,isDraft=false){let c=d.clientSnapshot||clients.find(z=>z.id===d.clientId)||{},company=invoiceSettings,logo=company.showLogo?'<img src="navodix-logo.png" alt="Navodix logo">':'',address=[company.registeredAddress,company.city,company.state,company.pin].filter(Boolean).join(', '),clientAddress=[c.billingAddress,c.city,c.state,c.pin,c.country].filter(Boolean).join(', '),itemRows=(d.items||[]).map((it,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(it.description)}</td><td class="num">${it.quantity}</td><td class="num">${money(it.rate)}</td><td class="num">${money(it.quantity*it.rate)}</td></tr>`).join(''),invoiceNo=d.number||'Assigned on Issue',gstText=company.gstStatus==='Registered'&&company.gstin?'GSTIN: '+escapeHtml(company.gstin):'GST Registration: Not Registered';return `<div id="invoicePreviewRoot"><div class="invoice-paper"> <div class="invoice-banner"><div>${logo}</div><div class="doc-title"><h2>COMMERCIAL INVOICE</h2><div>${isDraft?'DRAFT PREVIEW':'INVOICE'} · ${escapeHtml(invoiceNo)}</div></div></div><div class="invoice-paper-body">${isDraft?'<div class="invoice-draft-stamp">DRAFT · NOT AN ISSUED INVOICE</div>':''}<div class="invoice-company-name">${escapeHtml(company.companyName)}</div><div class="invoice-company-meta">${escapeHtml(address||'Registered address to be configured')}<br>${company.email?escapeHtml(company.email)+' · ':''}${company.phone?escapeHtml(company.phone)+' · ':''}${escapeHtml(company.website||'navodix.com')}<br>${gstText}${company.pan?' · PAN: '+escapeHtml(company.pan):''}</div><div class="invoice-section-title">BILL TO & INVOICE INFORMATION</div><div class="invoice-parties"><div class="invoice-party-box"><div class="party-label">Bill To</div><strong>${escapeHtml(c.legalName||d.client||'Client Name')}</strong><p>${escapeHtml(clientAddress||'Billing address not provided')}</p>${c.gstin?`<p>GSTIN: ${escapeHtml(c.gstin)}</p>`:''}${c.pan?`<p>PAN: ${escapeHtml(c.pan)}</p>`:''}${c.email?`<p>${escapeHtml(c.email)}</p>`:''}</div><div class="invoice-party-box"><div class="party-label">Invoice Details</div><div class="invoice-meta-grid"><div><small>Invoice Number</small><b>${escapeHtml(invoiceNo)}</b></div><div><small>Invoice Date</small><b>${invoiceDateLabel(d.date)}</b></div><div><small>Due Date</small><b>${invoiceDateLabel(d.due)}</b></div><div><small>Payment Terms</small><b>${Number(d.terms)||0} days</b></div><div><small>Currency</small><b>INR</b></div><div><small>Document Type</small><b>Commercial Invoice</b></div></div></div></div><div class="invoice-section-title">DESCRIPTION OF SERVICES / ITEMS</div><table class="invoice-items"><thead><tr><th style="width:34px">#</th><th>Description</th><th class="num">Qty</th><th class="num">Rate (₹)</th><th class="num">Amount (₹)</th></tr></thead><tbody>${itemRows}</tbody></table><div class="invoice-bottom"><div><div class="invoice-section-title" style="margin-top:0">BANK & PAYMENT DETAILS</div><div class="invoice-payment"><b>Account Name:</b> ${escapeHtml(company.accountHolder||company.companyName)}<br><b>Bank:</b> ${escapeHtml(company.bankName||'Bank details to be configured')}<br><b>Account Number:</b> ${escapeHtml(company.accountNumber||'—')}<br><b>IFSC:</b> ${escapeHtml(company.ifsc||'—')}<br><b>Branch:</b> ${escapeHtml(company.branch||'—')}${company.upi?'<br><b>UPI:</b> '+escapeHtml(company.upi):''}<br>${escapeHtml(company.paymentInstructions||'')}</div></div><div class="invoice-total-box"><div class="invoice-total-row"><span>Subtotal</span><b>${money(d.subtotal||0)}</b></div><div class="invoice-total-row"><span>Discount</span><b>${money(d.discount||0)}</b></div><div class="invoice-total-row grand"><span>Grand Total</span><span>${money(d.total||0)}</span></div></div></div>${company.amountWords?`<div class="invoice-amount-words"><b>Amount in Words:</b> Indian Rupees ${invoiceWords(d.total)} Only</div>`:''}${d.notes?`<div class="invoice-section-title">NOTES</div><div class="invoice-notes">${escapeHtml(d.notes)}</div>`:''}<div class="invoice-section-title">TERMS & CONDITIONS</div><div class="invoice-notes">${escapeHtml(d.termsText||'Payment is due within '+(Number(d.terms)||0)+' days from the invoice date. Please mention the invoice number when making payment.')}</div><div class="invoice-signature"><div>For ${escapeHtml(company.companyName)}<br><br>Authorised Signatory</div></div><div class="invoice-footer"><span>${escapeHtml(company.companyName)} · ${escapeHtml(company.website||'navodix.com')}</span><span>Thank you for your business</span></div></div></div></div>`}
function openInvoicePreview(d,isDraft=false){showModal(isDraft?'Commercial Invoice – Draft Preview':'Commercial Invoice – PDF Preview',invoiceDocumentHtml(d,isDraft),`<button class="btn btn-light" onclick="closeModal()">Close</button><button class="btn btn-primary" onclick="window.print()">▣ Print / Save as PDF</button>`);document.getElementById('modal').style.width='min(920px,100%)';}

function renderInvoiceRegister(){
 const list=demoInvoices.slice().sort((a,b)=>{const ad=a.date?new Date(a.date):new Date(0),bd=b.date?new Date(b.date):new Date(0);return bd-ad});

function filterInvoiceRegister(){const q=(document.getElementById('invoiceSearch')?.value||'').toLowerCase(),st=document.getElementById('invoiceStatusFilter')?.value||'',cl=document.getElementById('invoiceClientFilter')?.value||'';document.querySelectorAll('#invoiceRegisterTable tbody tr').forEach((r,i)=>{const x=demoInvoices.slice().sort((a,b)=>new Date(b.date||0)-new Date(a.date||0))[i];r.style.display=(!q||[x?.number,x?.client].join(' ').toLowerCase().includes(q))&&(!st||x?.status===st)&&(!cl||x?.client===cl)?'':'none'});}

</div>`,`<button class="btn btn-light" onclick="closeModal()">Close</button><button class="btn btn-primary" onclick="previewSavedInvoice('${escapeHtml(x.number)}')">▣ Preview / Print PDF</button>`);document.querySelector('#modalBackdrop .modal').classList.add('invoice-detail-modal')}

function refreshAdjustmentInvoiceInfo(){const no=document.getElementById('adInvoice')?.value,inv=demoInvoices.find(i=>i.number===no);const c=document.getElementById('adClient'),b=document.getElementById('adBalance');if(c)c.value=inv?.client||'—';if(b)b.value=inv?money(inv.balance):'—';const amount=document.getElementById('adAmount');if(amount&&inv&&document.getElementById('adType').value==='Credit Note')amount.max=inv.balance;else if(amount)amount.removeAttribute('max');}
function nextAdjustmentNumber(type,date){const d=new Date(date+'T00:00:00'),fyStart=3,startYear=d.getFullYear()-(d.getMonth()<fyStart?1:0),fy=String(startYear).slice(-2)+'-'+String(startYear+1).slice(-2),prefix=type==='Credit Note'?'CN':'DN',used=invoiceAdjustments.filter(x=>x.type===type&&x.number.includes('/'+fy+'/')).map(x=>Number(x.number.split('/').pop())||0),seq=Math.max(0,...used)+1;return `NAV-${prefix}/${fy}/${String(seq).padStart(3,'0')}`;}
function issueAdjustment(){const type=document.getElementById('adType').value,date=document.getElementById('adDate').value,no=document.getElementById('adInvoice').value,inv=demoInvoices.find(i=>i.number===no),reason=document.getElementById('adReason').value,description=document.getElementById('adDescription').value.trim(),amount=Number(document.getElementById('adAmount').value),notes=document.getElementById('adNotes').value.trim();if(!date||!inv||!reason||!description||!Number.isFinite(amount)||amount<=0){toast('Complete all required fields and enter a valid adjustment amount.','error');return}if(type==='Credit Note'&&amount>(inv.balance||0)+0.001){toast('Credit note amount cannot exceed the current outstanding balance in this prototype.','error');return}if(!confirm(`Issue this ${type} for ${money(amount)} against ${inv.number}?`))return;const number=nextAdjustmentNumber(type,date),record={number,type,date:paymentDateLabel(date),invoice:inv.number,client:inv.client,clientId:inv.clientId,amount,reason,description,notes,issuedBy:currentDirector};invoiceAdjustments.unshift(record);if(type==='Credit Note'){inv.total=Math.max(0,inv.total-amount);inv.balance=Math.max(0,inv.balance-amount);inv.subtotal=Math.max(0,(inv.subtotal||inv.total+amount)-amount);if(inv.balance<=0.001)inv.status='Paid';else if((inv.received||0)>0)inv.status='Partially Paid';}else{inv.total+=amount;inv.balance+=amount;inv.subtotal=(inv.subtotal||inv.total-amount)+amount;if((inv.received||0)>0)inv.status='Partially Paid';else inv.status='Issued';}transactions.unshift({date:record.date,name:type+' – '+inv.client,type,ref:number,amount:type==='Credit Note'?-amount:amount});closeModal();render();toast(number+' issued in the prototype.');}
function viewAdjustment(number){const x=invoiceAdjustments.find(a=>a.number===number);if(!x)return;showModal(x.type+' Details',`<div class="form-grid view-grid"><div><small>Note Number</small><div class="main-text">${escapeHtml(x.number)}</div></div><div><small>Document Type</small><div class="main-text">${escapeHtml(x.type)}</div></div><div><small>Note Date</small><div class="main-text">${escapeHtml(x.date)}</div></div><div><small>Original Invoice</small><div class="main-text">${escapeHtml(x.invoice)}</div></div><div><small>Client</small><div class="main-text">${escapeHtml(x.client)}</div></div><div><small>Adjustment Amount</small><div class="main-text">${money(x.amount)}</div></div><div class="full"><small>Reason</small><div class="main-text">${escapeHtml(x.reason)}</div></div><div class="full"><small>Description</small><div class="main-text">${escapeHtml(x.description)}</div></div><div class="full"><small>Additional Notes</small><div class="main-text">${escapeHtml(x.notes||'—')}</div></div><div><small>Issued By</small><div class="main-text">${escapeHtml(x.issuedBy)}</div></div><div><small>Status</small><div class="main-text">Issued</div></div></div><div class="note-box" style="margin-top:12px">This note is an issued adjustment record linked to the original invoice. The original invoice document remains unchanged.</div>`,`<button class="btn btn-light" onclick="closeModal()">Close</button>`);}

function renderSimple(page){let config={Vendors:['Vendor Master','Vendor Bills','Vendor Payments','Outstanding Payables'], 'Client Receipts':['Client','Receipt Date','Invoice Reference','Amount Received','Payment Mode'],Reports:['Income & Expense Summary','Cash Flow Statement','Director Contribution Report','GST Summary'],Settings:['Company Details','Directors & Permissions','Expense Categories','GST Configuration','Financial Year','Bank Account Setup']}[page]||[];return `<div class="page-head"><div><h2>${page}</h2><p>${page==='Vendors'?'Vendor records and direct payments from the company bank account.':page==='Client Receipts'?'Record client payments and allocate receipts to invoices.':page==='Reports'?'Financial summaries will be generated from posted accounting transactions.':'Configure the accounting masters and application settings.'}</p></div><button class="btn btn-primary" onclick="toast('${page} setup is planned for a later development step')">＋ Add New</button></div><div class="panel"><div class="panel-header"><h3>Planned capabilities</h3>${badge('Future phase')}</div><div class="panel-body">${config.map(x=>`<div class="transaction"><div class="trans-icon">✓</div><div class="trans-title">${x}</div></div>`).join('')}</div></div>`}

function renderExpenses(){let rows=expenses.map(e=>`<tr><td>${e.date}</td><td><b>${e.id}</b></td><td>${escapeHtml(e.description)}</td><td>${escapeHtml(e.category)}</td><td>${escapeHtml(e.vendor)}</td><td>${escapeHtml(e.paidBy)}</td><td>${money(e.amount+e.gst)}</td><td>${badge(e.status)}</td><td><button class="action-link" onclick="viewExpense('${e.id}')">View</button></td></tr>`).join('');return `<div class="page-head"><div><h2>Expense Register</h2><p>Record company purchases and services, attach supporting bills and track director-paid expenses.</p></div><button class="btn btn-primary" onclick="openExpenseModal()">＋ Add Expense</button></div><div class="summary-grid dashboard-summary-grid">${card('Expense Records',expenses.length,'All recorded expenses','▤')}${card('Company Paid',money(expenses.filter(x=>x.paidBy==='Company').reduce((a,x)=>a+x.amount+x.gst,0)),'Paid from company bank','₹','blue')}${card('Director Paid',money(expenses.filter(x=>x.paidBy!=='Company').reduce((a,x)=>a+x.amount+x.gst,0)),'Potential reimbursements','◉','purple')}${card('Pending Claims',expenses.filter(x=>x.status==='Claim pending').length,'Require expense sheet','◷','orange')}</div><div class="toolbar"><div class="filters"><input class="field-control search" placeholder="Search expense, vendor or bill number…" oninput="filterTable(this.value)"><select class="field-control" onchange="filterStatus(this.value)"><option value="">All statuses</option><option>Paid</option><option>Claim pending</option><option>Claim approved</option></select></div><button class="btn btn-light btn-sm" onclick="toast('Export preview is available in the implementation phase')">⇩ Export</button></div><div id="expenseTable">${table(['Date','Expense No.','Description','Category','Vendor','Paid By','Gross Amount','Status','Action'],rows)}</div><div class="note-box" style="margin-top:14px">Capture bill number, supplier GST details, taxable value, GST components and supporting document. A director-paid expense is recorded once; reimbursement settles the payable without duplicating the expense.</div>`}
function openExpenseModal(){showModal('Add Expense',`<div class="form-grid"><div class="form-field"><label>Expense Date *</label><input class="form-control" id="exDate" type="date" value="2026-11-22"></div><div class="form-field"><label>Expense Category *</label><select class="form-control" id="exCategory">${expenseCategories.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-field"><label>Description *</label><input class="form-control" id="exDesc"></div><div class="form-field"><label>Vendor / Supplier</label><input class="form-control" id="exVendor"></div><div class="form-field"><label>Bill / Invoice Number</label><input class="form-control" id="exBill"></div><div class="form-field"><label>Paid By *</label><select class="form-control" id="exPaid"><option>Company</option><option>Suryanarayana</option><option>Dinesan</option></select></div><div class="form-field"><label>Taxable Amount (₹) *</label><input class="form-control" type="number" min="0" id="exAmount"></div><div class="form-field"><label>GST Amount (₹)</label><input class="form-control" type="number" min="0" id="exGst" value="0"></div><div class="form-field"><label>Supplier GSTIN</label><input class="form-control" id="exGstin"></div><div class="form-field"><label>Payment Reference</label><input class="form-control" id="exRef"></div><div class="form-field full"><label>Bill / Receipt Attachment</label><input class="form-control" type="file" id="exFile" accept=".pdf,.jpg,.jpeg,.png"></div><div class="form-field full"><label>Remarks</label><textarea class="form-control" id="exRemarks" rows="2"></textarea></div></div><div class="note-box" style="margin-top:12px">Prototype attachment selection only; files are not uploaded or stored.</div>`,`<button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveExpense()">Save Expense</button>`)}
function saveExpense(){let v=id=>document.getElementById(id).value,amount=Number(v('exAmount')),gst=Number(v('exGst'))||0;if(!v('exDesc').trim()||!amount||amount<0){toast('Enter an expense description and valid amount.','error');return}let id='EXP-'+String(Math.max(0,...expenses.map(x=>Number(x.id.split('-')[1])||0))+1).padStart(4,'0');expenses.unshift({id,date:v('exDate'),description:v('exDesc'),category:v('exCategory'),vendor:v('exVendor')||'—',paidBy:v('exPaid'),amount,gst,status:v('exPaid')==='Company'?'Paid':'Claim pending',invoice:v('exBill'),gstin:v('exGstin'),reference:v('exRef'),remarks:v('exRemarks'),attachment:document.getElementById('exFile').files[0]?.name||''});transactions.unshift({date:v('exDate'),name:v('exDesc'),type:'Expense',ref:id,amount:-(amount+gst)});closeModal();render();toast('Expense recorded in prototype.');}
function renderReimbursements(){let pending=reimbursements.filter(x=>x.status==='Pending payment').reduce((a,x)=>a+x.amount,0),paid=reimbursements.filter(x=>x.status==='Paid').reduce((a,x)=>a+x.amount,0),rows=reimbursements.map(x=>`<tr><td><b>${x.id}</b></td><td>${x.date}</td><td>${x.director}</td><td>${x.claim}</td><td>${money(x.amount)}</td><td>${badge(x.status)}</td><td>${x.status==='Pending payment'?`<button class="action-link" onclick="payReimbursement('${x.id}')">Record Payment</button>`:`<button class="action-link" onclick="viewReimbursement('${x.id}')">View</button>`}</td></tr>`).join('');return `<div class="page-head"><div><h2>Reimbursements</h2><p>Settle approved expenses paid personally by directors. Settlement does not create a second expense.</p></div><button class="btn btn-primary" onclick="openReimbursementModal()">＋ Record Reimbursement</button></div><div class="summary-grid dashboard-summary-grid">${card('Pending Settlement',money(pending),'Approved personal expenses','₹','orange')}${card('Settled',money(paid),'Payments recorded','✓')}${card('Reimbursement Records',reimbursements.length,'All directors','▤','blue')}${card('Payment Account','Company Bank','Primary account','▣','purple')}</div><div class="panel" style="margin-top:16px"><div class="panel-header"><h3>Reimbursement Register</h3></div>${table(['Reference','Date','Director','Claim','Amount','Status','Action'],rows)}</div>`}
function openReimbursementModal(){let approved=sheets.filter(s=>s.status==='Approved');showModal('Record Reimbursement',`<div class="form-grid"><div class="form-field"><label>Approved Claim *</label><select id="rbClaim" class="form-control">${approved.map(s=>`<option value="${s.id}">${s.id} – ${s.director} – ${money(s.total)}</option>`).join('')}</select></div><div class="form-field"><label>Payment Date *</label><input id="rbDate" class="form-control" type="date" value="2026-11-22"></div><div class="form-field"><label>Payment Mode</label><select id="rbMode" class="form-control"><option>Bank Transfer</option><option>NEFT</option><option>RTGS</option><option>IMPS</option><option>UPI</option></select></div><div class="form-field"><label>UTR / Reference</label><input id="rbRef" class="form-control"></div></div>`,`<button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveReimbursement()">Save Settlement</button>`)}
function saveReimbursement(){let s=sheets.find(x=>x.id===document.getElementById('rbClaim').value);if(!s){toast('No approved claim selected.','error');return}reimbursements.unshift({id:'RMB-'+String(reimbursements.length+1).padStart(4,'0'),date:document.getElementById('rbDate').value,director:s.director,claim:s.id,amount:s.total,status:'Paid',reference:document.getElementById('rbRef').value});transactions.unshift({date:document.getElementById('rbDate').value,name:'Reimbursement – '+s.director,type:'Reimbursement settlement',ref:'RMB-'+String(reimbursements.length).padStart(4,'0'),amount:-s.total});closeModal();render();toast('Reimbursement settlement recorded.');}
function payReimbursement(id){let x=reimbursements.find(r=>r.id===id);if(!x)return;showModal('Settle Reimbursement',`<div class="note-box">${x.director} · ${x.claim} · ${money(x.amount)}</div><div class="form-grid" style="margin-top:12px"><div class="form-field"><label>Payment Date</label><input class="form-control" id="rPayDate" type="date" value="2026-11-22"></div><div class="form-field"><label>UTR / Reference</label><input class="form-control" id="rPayRef"></div></div>`,`<button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="x.status='Paid';x.reference=document.getElementById('rPayRef').value;closeModal();render();toast('Reimbursement marked paid.')">Confirm Payment</button>`)}
function viewReimbursement(id){let x=reimbursements.find(r=>r.id===id);showModal('Reimbursement Details',`<div class="form-grid view-grid"><div><label>Reference</label><b>${x.id}</b></div><div><label>Status</label><b>${x.status}</b></div><div><label>Director</label><b>${x.director}</b></div><div><label>Claim</label><b>${x.claim}</b></div><div><label>Amount</label><b>${money(x.amount)}</b></div><div><label>Payment Reference</label><b>${x.reference||'—'}</b></div></div>`)}
function renderVendors(){let rows=vendors.map(v=>`<tr><td><b>${v.id}</b></td><td>${escapeHtml(v.name)}</td><td>${escapeHtml(v.contact)}</td><td>${escapeHtml(v.email)}</td><td>${v.terms} days</td><td>${badge(v.status)}</td><td><button class="action-link" onclick="viewVendor('${v.id}')">View</button></td></tr>`).join('');return `<div class="page-head"><div><h2>Vendors & Payments</h2><p>Maintain supplier records, vendor bills, payments and outstanding payables.</p></div><button class="btn btn-primary" onclick="openVendorModal()">＋ Add Vendor</button></div><div class="summary-grid dashboard-summary-grid">${card('Vendors',vendors.length,'Active supplier records','▤')}${card('Bills Outstanding',money(vendorBills.reduce((a,b)=>a+b.amount-b.paid,0)),'Payables balance','₹','orange')}${card('Bills Recorded',vendorBills.length,'Supplier invoices','▣','blue')}${card('Payments Made',money(vendorPayments.reduce((a,p)=>a+p.amount,0)),'Recorded payments','✓')}</div><div class="panel" style="margin-top:15px"><div class="panel-header"><h3>Vendor Master</h3></div>${table(['Vendor Code','Vendor Name','Contact','Email','Payment Terms','Status','Action'],rows)}</div><div class="panel" style="margin-top:15px"><div class="panel-header"><h3>Vendor Bills</h3><button class="btn btn-light btn-sm" onclick="openVendorBillModal()">＋ Record Bill</button></div>${table(['Bill No.','Vendor','Bill Date','Due Date','Supplier Ref.','Bill Amount','Paid','Balance','Status'],vendorBills.map(b=>`<tr><td>${b.id}</td><td>${b.vendor}</td><td>${b.date}</td><td>${b.due}</td><td>${b.ref}</td><td>${money(b.amount)}</td><td>${money(b.paid)}</td><td>${money(b.amount-b.paid)}</td><td>${badge(b.status)}</td></tr>`).join(''))}</div><div class="panel" style="margin-top:15px"><div class="panel-header"><h3>Vendor Payments</h3><button class="btn btn-light btn-sm" onclick="openVendorPaymentModal()">＋ Make Payment</button></div>${table(['Payment No.','Date','Vendor','Amount','Mode','Bank Reference','Bill'],vendorPayments.map(p=>`<tr><td>${p.id}</td><td>${p.date}</td><td>${p.vendor}</td><td>${money(p.amount)}</td><td>${p.mode}</td><td>${p.reference}</td><td>${p.bill||'—'}</td></tr>`).join(''))}<div class="note-box" style="margin:12px"><b>Payment approval control – agreed workflow</b><br>Payment request: Draft → Pending Approval → Approved – Payment Pending. The approver may Undo Approval before payment initiation. Once payment is initiated or completed, approval cannot be undone; use payment cancellation / reversal controls instead. The live approval and bank execution workflow is not connected in this UI prototype.</div></div>`}
function openVendorModal(){showModal('Add Vendor',`<div class="form-grid"><div class="form-field"><label>Legal Name *</label><input id="vnName" class="form-control"></div><div class="form-field"><label>Contact Person</label><input id="vnContact" class="form-control"></div><div class="form-field"><label>Email</label><input id="vnEmail" class="form-control"></div><div class="form-field"><label>Phone</label><input id="vnPhone" class="form-control"></div><div class="form-field"><label>GSTIN</label><input id="vnGstin" class="form-control"></div><div class="form-field"><label>Payment Terms (days)</label><input id="vnTerms" type="number" value="30" class="form-control"></div><div class="form-field full"><label>Address</label><textarea id="vnAddress" class="form-control"></textarea></div></div>`,`<button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveVendor()">Save Vendor</button>`)}

function openVendorBillModal(){showModal('Record Vendor Bill',`<div class="form-grid"><div class="form-field"><label>Vendor *</label><select id="vbVendor" class="form-control">${vendors.map(v=>`<option>${v.name}</option>`).join('')}</select></div><div class="form-field"><label>Bill Date</label><input id="vbDate" type="date" class="form-control" value="2026-11-22"></div><div class="form-field"><label>Due Date</label><input id="vbDue" type="date" class="form-control"></div><div class="form-field"><label>Supplier Invoice No.</label><input id="vbRef" class="form-control"></div><div class="form-field"><label>Bill Amount (₹)</label><input id="vbAmount" type="number" class="form-control"></div><div class="form-field"><label>Attachment</label><input id="vbFile" type="file" class="form-control" accept=".pdf,.jpg,.png"></div></div>`,`<button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveVendorBill()">Save Bill</button>`)}
function saveVendorBill(){let a=Number(document.getElementById('vbAmount').value);if(!a||a<=0){toast('Enter a valid bill amount.','error');return}vendorBills.unshift({id:'VB-'+String(vendorBills.length+1).padStart(4,'0'),vendor:document.getElementById('vbVendor').value,date:document.getElementById('vbDate').value,due:document.getElementById('vbDue').value,ref:document.getElementById('vbRef').value,amount:a,paid:0,status:'Unpaid'});closeModal();render();toast('Vendor bill recorded.')}
function openVendorPaymentModal(){let due=vendorBills.filter(b=>b.amount>b.paid);showModal('Make Vendor Payment',`<div class="form-grid"><div class="form-field"><label>Outstanding Bill *</label><select id="vpBill" class="form-control">${due.map(b=>`<option value="${b.id}">${b.id} – ${b.vendor} – Balance ${money(b.amount-b.paid)}</option>`).join('')}</select></div><div class="form-field"><label>Payment Date</label><input id="vpDate" type="date" value="2026-11-22" class="form-control"></div><div class="form-field"><label>Payment Amount (₹)</label><input id="vpAmount" type="number" class="form-control"></div><div class="form-field"><label>Mode</label><select id="vpMode" class="form-control"><option>Bank Transfer</option><option>NEFT</option><option>RTGS</option><option>IMPS</option><option>UPI</option><option>Cheque</option></select></div><div class="form-field full"><label>UTR / Bank Reference</label><input id="vpRef" class="form-control"></div></div>`,`<button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveVendorPayment()">Record Payment</button>`)}
function saveVendorPayment(){let b=vendorBills.find(x=>x.id===document.getElementById('vpBill').value),a=Number(document.getElementById('vpAmount').value);if(!b||!a||a<=0||a>b.amount-b.paid){toast('Enter a valid amount not exceeding the bill balance.','error');return}b.paid+=a;b.status=b.paid===b.amount?'Paid':'Partially Paid';let id='VP-'+String(vendorPayments.length+1).padStart(4,'0');vendorPayments.unshift({id,date:document.getElementById('vpDate').value,vendor:b.vendor,amount:a,mode:document.getElementById('vpMode').value,reference:document.getElementById('vpRef').value,bill:b.id});transactions.unshift({date:document.getElementById('vpDate').value,name:'Vendor payment – '+b.vendor,type:'Vendor payment',ref:id,amount:-a});closeModal();render();toast('Vendor payment recorded.')}
function renderPayroll(){let rows=payrollRecords.map(p=>`<tr><td>${p.month}</td><td>${p.employee}</td><td>${money(p.gross)}</td><td>${money(p.deductions)}</td><td><b>${money(p.net)}</b></td><td>${badge(p.status)}</td><td><button class="action-link" onclick="viewPayroll('${p.month}')">View</button></td></tr>`).join('');return `<div class="page-head"><div><h2>Payroll</h2><p>Prepare monthly salary records, deductions, net pay and payment tracking.</p></div><button class="btn btn-primary" onclick="openPayrollModal()">＋ Prepare Payroll</button></div><div class="summary-grid dashboard-summary-grid">${card('Payroll Runs',payrollRecords.length,'Illustrative records','▤')}${card('Gross Salary',money(payrollRecords.reduce((a,p)=>a+p.gross,0)),'Current listed runs','₹','blue')}${card('Deductions',money(payrollRecords.reduce((a,p)=>a+p.deductions,0)),'Illustrative deductions','−','orange')}${card('Net Pay',money(payrollRecords.reduce((a,p)=>a+p.net,0)),'Salary payable','✓')}</div><div class="panel" style="margin-top:16px"><div class="panel-header"><h3>Payroll Register</h3></div>${table(['Payroll Month','Employee','Gross Salary','Deductions','Net Pay','Status','Action'],rows)}</div><div class="note-box" style="margin-top:12px">Payroll is a prototype workflow only. Statutory deductions, PF/ESI/PT/TDS applicability, payslip compliance and payroll accounting must be configured and validated with the company's payroll professional before production use.</div>`}
function openPayrollModal(){showModal('Prepare Payroll',`<div class="form-grid"><div class="form-field"><label>Payroll Month *</label><input id="prMonth" class="form-control" placeholder="November 2026"></div><div class="form-field"><label>Employee / Resource *</label><input id="prEmployee" class="form-control"></div><div class="form-field"><label>Gross Salary (₹)</label><input id="prGross" type="number" class="form-control"></div><div class="form-field"><label>Total Deductions (₹)</label><input id="prDeduct" type="number" value="0" class="form-control"></div><div class="form-field"><label>Payment Status</label><select id="prStatus" class="form-control"><option>Draft</option><option>Approved</option><option>Paid</option></select></div></div>`,`<button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="savePayroll()">Save Payroll</button>`)}
function savePayroll(){let gross=Number(document.getElementById('prGross').value),ded=Number(document.getElementById('prDeduct').value)||0;if(!document.getElementById('prMonth').value||!document.getElementById('prEmployee').value||gross<=0||ded>gross){toast('Enter valid payroll details.','error');return}payrollRecords.unshift({month:document.getElementById('prMonth').value,employee:document.getElementById('prEmployee').value,gross,deductions:ded,net:gross-ded,status:document.getElementById('prStatus').value});closeModal();render();toast('Payroll record saved.')}
function viewPayroll(month){let p=payrollRecords.find(x=>x.month===month);showModal('Payroll Details',`<div class="form-grid view-grid"><div><label>Month</label><b>${p.month}</b></div><div><label>Employee</label><b>${p.employee}</b></div><div><label>Gross</label><b>${money(p.gross)}</b></div><div><label>Deductions</label><b>${money(p.deductions)}</b></div><div><label>Net Pay</label><b>${money(p.net)}</b></div><div><label>Status</label><b>${p.status}</b></div></div>`)}

function renderDirectorAdvances(){
 const business=directorAdvances.filter(x=>x.type==='Business Expense Advance').reduce((a,x)=>a+x.balance,0);
 const personal=directorAdvances.filter(x=>x.type==='Personal Advance / Director Loan').reduce((a,x)=>a+(x.principalOutstanding??x.balance),0);
 const pending=directorAdvances.filter(x=>x.status==='Pending approval').length;
 const overdue=directorAdvances.filter(x=>x.status==='Overdue').length;
 const rows=directorAdvances.map(x=>{const personalLoan=x.type==='Personal Advance / Director Loan';const outstanding=personalLoan?(x.principalOutstanding??x.balance):x.balance;return `<tr><td><b>${x.id}</b><div class="sub-text">${x.date}</div></td><td>${x.director}</td><td>${x.type}</td><td>${escapeHtml(x.purpose)}</td><td>${money(x.requested)}</td><td>${money(x.approved)}</td><td>${money(x.disbursed)}</td><td>${money(outstanding)}</td><td>${badge(x.status)}</td><td><button class="btn btn-light btn-sm" onclick="viewAdvance('${x.id}')">View</button> ${['Draft','Approval Reversed'].includes(x.status)?`<button class="btn btn-light btn-sm" onclick="editAdvance('${x.id}')">Edit</button> <button class="btn btn-danger btn-sm" onclick="deleteRequest('advance','${x.id}')">Delete</button> <button class="btn btn-primary btn-sm" onclick="resubmitAdvance('${x.id}')">Resubmit</button>`:''}${x.status==='Pending approval'?`<button class="btn btn-light btn-sm" onclick="withdrawRequest('advance','${x.id}')">Withdraw</button> <button class="btn btn-danger btn-sm" onclick="deleteRequest('advance','${x.id}')">Delete</button>`:''}${x.status==='Approved – Payment Pending'?`<button class="btn btn-light btn-sm" onclick="undoApproval('advance','${x.id}')">Undo Approval</button>`:''} ${x.status==='Active'&&personalLoan?`<button class="btn btn-primary btn-sm" onclick="openAdvanceRepayment('${x.id}')">Record Repayment</button>`:''}${x.status==='Active'&&!personalLoan&&outstanding>0?`<button class="btn btn-primary btn-sm" onclick="openAdvanceRepayment('${x.id}')">Record Return</button>`:''}</td></tr>`}).join('');
 const repaymentRows=directorAdvances.flatMap(x=>(x.repayments||[]).map(r=>`<tr><td>${r.date}</td><td><b>${x.id}</b></td><td>${x.director}</td><td>${r.kind}</td><td>${money(r.principal||r.amount||0)}</td><td>${money(r.interest||0)}</td><td>${escapeHtml(r.mode||'—')}</td><td>${escapeHtml(r.reference||'—')}</td></tr>`)).join('');
 return `<div class="page-head"><div><h2>Director Advance Management</h2><p>Request, approve, disburse, record repayments and settle business advances and personal director loans.</p></div><button class="btn btn-primary" onclick="openAdvanceRequest()">＋ New Advance Request</button></div>
 <div class="summary-grid dashboard-summary-grid">${card('Business Advances Outstanding',money(business),'Recoverable pending expense settlement','₹')}${card('Personal Loans Principal Outstanding',money(personal),'Principal balance; interest tracked separately','₹','blue')}${card('Pending Approvals',pending,'Awaiting other director review','◷','orange')}${card('Overdue Settlements',overdue,'Requires follow-up','!','purple')}</div>
 <div class="panel" style="margin-top:15px"><div class="panel-header"><h3>Advance Register</h3><span class="sub-text">Illustrative prototype records</span></div>${table(['Request / Date','Director','Advance Type','Purpose','Requested','Approved','Disbursed','Outstanding Principal / Balance','Status','Action'],rows)}</div>
 <div class="grid-2" style="margin-top:15px"><div class="panel"><div class="panel-header"><h3>Business Expense Advances</h3></div><div class="panel-body"><p class="sub-text">Link eligible expense claims and bills. Record unused funds returned by the director, then reconcile the remaining advance balance.</p><button class="btn btn-light btn-sm" onclick="openAdvanceRequest('Business Expense Advance')">＋ Request Business Advance</button></div></div><div class="panel"><div class="panel-header"><h3>Personal Advances / Director Loans</h3></div><div class="panel-body"><p class="sub-text">Track principal and interest separately. Record full or partial repayments, instalments and early settlement against each loan.</p><button class="btn btn-light btn-sm" onclick="openAdvanceRequest('Personal Advance / Director Loan')">＋ Request Personal Loan</button></div></div></div>
 <div class="panel" style="margin-top:15px"><div class="panel-header"><h3>Repayment & Refund Register</h3><span class="sub-text">All recorded repayments and unused-fund returns</span></div>${table(['Date','Advance ID','Director','Transaction Type','Principal / Returned','Interest','Payment Mode','Bank Reference'],repaymentRows)}</div>
 <div class="note-box" style="margin-top:12px">Personal loan repayments reduce principal and record interest separately. Business advance returns reduce the unutilised advance balance. In production, each receipt will also create a linked company bank credit and audit entry. Prototype records are illustrative only.</div>`;
}
function openAdvanceRepayment(id){let x=directorAdvances.find(a=>a.id===id);if(!x)return;const personal=x.type==='Personal Advance / Director Loan';const principal=personal?(x.principalOutstanding??x.balance):x.balance;const interest=personal?(x.interestOutstanding||0):0;showModal(personal?'Record Director Loan Repayment':'Record Unused Advance Return',`<div class="view-grid"><div><small>Advance ID</small><b>${x.id}</b></div><div><small>Director</small><b>${escapeHtml(x.director)}</b></div><div><small>Principal / Advance Outstanding</small><b>${money(principal)}</b></div>${personal?`<div><small>Interest Outstanding</small><b>${money(interest)}</b></div>`:''}</div><div class="form-grid" style="margin-top:14px"><div class="form-field"><label>Receipt Date *</label><input class="form-control" id="arDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="form-field"><label>Payment Mode *</label><select class="form-control" id="arMode"><option>Bank Transfer</option><option>NEFT</option><option>RTGS</option><option>IMPS</option><option>UPI</option><option>Cheque</option><option>Cash</option></select></div>${personal?`<div class="form-field"><label>Principal Repaid (₹) *</label><input class="form-control" id="arPrincipal" type="number" min="0" max="${principal}" step="0.01" value="0"></div><div class="form-field"><label>Interest Paid (₹)</label><input class="form-control" id="arInterest" type="number" min="0" max="${interest}" step="0.01" value="0"></div>`:`<div class="form-field"><label>Unused Amount Returned (₹) *</label><input class="form-control" id="arPrincipal" type="number" min="0.01" max="${principal}" step="0.01" placeholder="Enter returned amount"></div>`}<div class="form-field full"><label>Bank / UTR Reference</label><input class="form-control" id="arReference" placeholder="Enter bank transaction reference"></div><div class="form-field full"><label>Remarks</label><textarea class="form-control" id="arRemarks" rows="2" placeholder="Optional notes"></textarea></div></div><div class="note-box" style="margin-top:12px">${personal?'Principal and interest are recorded separately. The repayment is treated as received only in this prototype; production will link it to the company bank transaction register.':'The returned amount reduces the business advance balance. Expense utilisation must be reconciled separately.'}</div>`,`<button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveAdvanceRepayment('${x.id}',${personal})">✓ Record ${personal?'Repayment':'Return'}</button>`)}
function saveAdvanceRepayment(id,personal){let x=directorAdvances.find(a=>a.id===id);if(!x)return;let principal=Number(document.getElementById('arPrincipal')?.value||0),interest=Number(document.getElementById('arInterest')?.value||0),maxPrincipal=personal?(x.principalOutstanding??x.balance):x.balance,maxInterest=x.interestOutstanding||0;if(principal<0||interest<0||principal>maxPrincipal||interest>maxInterest||(!principal&&!interest)){toast('Enter a valid amount within the outstanding balance.');return}if(!document.getElementById('arDate').value){toast('Select the receipt date.');return}x.repayments=x.repayments||[];x.repayments.push({date:document.getElementById('arDate').value,kind:personal?'Loan Repayment':'Unused Advance Return',principal,interest,amount:principal,mode:document.getElementById('arMode').value,reference:document.getElementById('arReference').value.trim(),remarks:document.getElementById('arRemarks').value.trim()});if(personal){x.principalOutstanding=maxPrincipal-principal;x.interestOutstanding=maxInterest-interest;x.balance=x.principalOutstanding+x.interestOutstanding;if(x.principalOutstanding===0&&x.interestOutstanding===0)x.status='Settled'}else{x.balance=maxPrincipal-principal;if(x.balance===0)x.status='Returned / Settled'}closeModal();render();toast(personal?'Loan repayment recorded in prototype.':'Unused advance return recorded in prototype.');}

ect></div><div class="form-field full"><label>Supporting document (prototype placeholder)</label><input class="form-control" type="file" disabled><small>Document upload is not connected in this prototype.</small></div></div><div class="note-box" style="margin-top:12px">Submitting sends an approval request email to the other director in the planned production workflow. Approval is performed only after signing in to the portal.</div>`,'<button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitAdvanceRequest()">Submit Request</button>');

function toggleAdvanceTerms(){let t=document.getElementById('advType')?.value, b=document.getElementById('advBusiness'),p=document.getElementById('advPersonal');if(b)b.style.display=t==='Business Expense Advance'?'block':'none';if(p)p.style.display=t==='Personal Advance / Director Loan'?'block':'none';}
function toggleRate(){let i=document.getElementById('advInterest'),w=document.getElementById('advRateWrap');if(w)w.style.display=i?.value==='Interest-bearing'?'block':'none';}
function submitAdvanceRequest(){let type=document.getElementById('advType').value,amount=Number(document.getElementById('advAmount').value),date=document.getElementById('advDate').value,purpose=document.getElementById('advPurpose').value.trim(),interest=document.getElementById('advInterest')?.value||'Not applicable',rate=Number(document.getElementById('advRate')?.value||0);if(!amount||amount<=0||!date||!purpose){toast('Enter amount, required date and purpose.');return}if(type==='Personal Advance / Director Loan'&&interest==='Interest-bearing'&&rate<=0){toast('Enter a valid proposed interest rate.');return}directorAdvances.unshift({id:'ADV-'+String(directorAdvances.length+1).padStart(4,'0'),date:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),director:document.getElementById('directorSwitch')?.value||'Suryanarayana',type,purpose,requested:amount,approved:0,disbursed:0,utilised:0,balance:0,status:'Pending approval',interestType:type==='Business Expense Advance'?'Not applicable':interest,rate:interest==='Interest-bearing'?rate:0,requiredDate:date});closeModal();render();toast('Request submitted. Approval email notification is demonstrated, not sent by this prototype.');}
function viewAdvance(id){let x=directorAdvances.find(a=>a.id===id);if(!x)return;const personal=x.type==='Personal Advance / Director Loan',principal=personal?(x.principalOutstanding??x.balance):x.balance,interest=x.interestOutstanding||0,history=(x.repayments||[]).map(r=>`<tr><td>${r.date}</td><td>${r.kind}</td><td>${money(r.principal||0)}</td><td>${money(r.interest||0)}</td><td>${escapeHtml(r.reference||'—')}</td></tr>`).join('');showModal('Advance Request – '+x.id,`<div class="view-grid"><div><small>Director</small><b>${escapeHtml(x.director)}</b></div><div><small>Type</small><b>${escapeHtml(x.type)}</b></div><div><small>Requested Amount</small><b>${money(x.requested)}</b></div><div><small>Approved Amount</small><b>${money(x.approved)}</b></div><div><small>Disbursed Amount</small><b>${money(x.disbursed)}</b></div><div><small>${personal?'Principal Outstanding':'Advance Balance'}</small><b>${money(principal)}</b></div>${personal?`<div><small>Interest Outstanding</small><b>${money(interest)}</b></div>`:''}<div class="full"><small>Purpose</small><b>${escapeHtml(x.purpose)}</b></div><div><small>Interest Terms</small><b>${escapeHtml(x.interestType)}${x.rate?' · '+x.rate+'% p.a.':''}</b></div><div><small>Status</small><b>${escapeHtml(x.status)}</b></div></div><div style="margin-top:16px;font-weight:700">Repayment / Return History</div>${table(['Date','Type','Principal / Returned','Interest','Reference'],history)}<div class="note-box" style="margin-top:12px">Approval is by the other director only. Production workflow will email the approver and requester; this prototype does not send email or execute bank transfers.</div>`,`<button class="btn btn-light" onclick="closeModal()">Close</button>${x.status==='Pending approval'?`<button class="btn btn-primary" onclick="approveAdvance('${x.id}')">Approve (demo)</button>`:''}${x.status==='Approved – Payment Pending'?`<button class="btn btn-light" onclick="undoApproval('advance','${x.id}')">Undo Approval</button>`:''}${x.status==='Active'&&((personal&&principal+interest>0)||(!personal&&principal>0))?`<button class="btn btn-primary" onclick="openAdvanceRepayment('${x.id}')">${personal?'Record Repayment':'Record Return'}</button>`:''}`);}
function approveAdvance(id){let x=directorAdvances.find(a=>a.id===id);if(!x)return;let approver=document.getElementById('directorSwitch')?.value||'Suryanarayana';if(approver===x.director){toast('Self-approval is not permitted. Switch to the other director.');return}x.approved=x.requested;x.status='Approved – Payment Pending';x.approvedBy=approver;x.approvalHistory=[...(x.approvalHistory||[]),{action:'Approved',by:approver,at:new Date().toISOString()}];closeModal();render();toast('Approved in prototype. Approval email is not actually sent.');}

function deleteRequest(kind,id){const item=kind==='claim'?sheets.find(x=>x.id===id):directorAdvances.find(x=>x.id===id);if(!item||!['Draft','Pending approval','Approval Reversed'].includes(item.status)){toast('This request can no longer be deleted.','error');return}confirmBox('Delete request?',`Delete ${id}? This action will be recorded in the prototype audit history.`,()=>{item.status='Deleted';item.deletedAt=new Date().toISOString();item.deletedBy=currentDirector;render();toast('Request deleted in prototype.')},'Keep request','Delete','danger')}
function withdrawRequest(kind,id){const item=kind==='claim'?sheets.find(x=>x.id===id):directorAdvances.find(x=>x.id===id);if(!item||item.status!=='Pending approval'){toast('Only requests awaiting approval can be withdrawn.','error');return}confirmBox('Withdraw request?',`Withdraw ${id} from the approval queue?`,()=>{item.status='Draft';item.withdrawnAt=new Date().toISOString();item.withdrawnBy=currentDirector;render();toast('Request withdrawn. You can edit or delete it.')},'Keep pending','Withdraw','danger')}
function undoApproval(kind,id){const item=kind==='claim'?sheets.find(x=>x.id===id):directorAdvances.find(x=>x.id===id);if(!item||item.status!=='Approved – Payment Pending'){toast('Approval can only be reversed before payment is initiated.','error');return}let reason=prompt('Enter the reason for reversing this approval:');if(!reason||!reason.trim())return;item.status='Approval Reversed';item.approvalHistory=[...(item.approvalHistory||[]),{action:'Approval Reversed',by:currentDirector,at:new Date().toISOString(),reason:reason.trim()}];item.reversalReason=reason.trim();item.reversedBy=currentDirector;item.reversedAt=new Date().toISOString();render();toast('Approval reversed. Requester can now edit, delete or resubmit.')}
function editSheet(id){let s=sheets.find(x=>x.id===id);if(!s||!['Draft','Approval Reversed'].includes(s.status))return;let amount=prompt('Update claim amount (INR):',String(s.total));if(amount===null)return;let n=Number(amount);if(!n||n<=0){toast('Enter a valid claim amount.','error');return}s.total=n;s.status='Draft';s.editedAt=new Date().toISOString();s.approvalHistory=[...(s.approvalHistory||[]),{action:'Edited',by:currentDirector,at:new Date().toISOString()}];render();toast('Claim updated. Submit it again when ready.')}
function submitSheetAgain(id){let s=sheets.find(x=>x.id===id);if(!s||!['Draft','Approval Reversed'].includes(s.status))return;s.status='Pending approval';s.submittedAt=new Date().toISOString();render();toast('Claim resubmitted for other-director approval.')}
function viewClaim(id){let s=sheets.find(x=>x.id===id);if(!s)return;showModal('Expense Claim – '+id,`<div class="view-grid"><div><small>Submitted By</small><b>${escapeHtml(s.director)}</b></div><div><small>Amount</small><b>${money(s.total)}</b></div><div><small>Status</small><b>${escapeHtml(s.status)}</b></div><div><small>Approved By</small><b>${escapeHtml(s.approvedBy||'—')}</b></div><div class="full"><small>Approval / Reversal History</small><b>${(s.approvalHistory||[]).map(h=>`${h.action} by ${h.by} · ${new Date(h.at).toLocaleString()} ${h.reason?'· '+h.reason:''}`).join('<br>')||'No history'}</b></div></div>`,`<button class="btn btn-light" onclick="closeModal()">Close</button>${s.status==='Approved – Payment Pending'?`<button class="btn btn-light" onclick="undoApproval('claim','${id}')">Undo Approval</button>`:''}`)}
function editAdvance(id){let x=directorAdvances.find(a=>a.id===id);if(!x||!['Draft','Approval Reversed'].includes(x.status))return;let amount=prompt('Update requested amount (INR):',String(x.requested));if(amount===null)return;let n=Number(amount);if(!n||n<=0){toast('Enter a valid amount.','error');return}let purpose=prompt('Update purpose:',x.purpose);if(purpose===null)return;if(!purpose.trim())return;x.requested=n;x.purpose=purpose.trim();x.status='Draft';x.editedAt=new Date().toISOString();x.approvalHistory=[...(x.approvalHistory||[]),{action:'Edited',by:currentDirector,at:new Date().toISOString()}];render();toast('Advance / loan request updated. Submit it again when ready.')}
function resubmitAdvance(id){let x=directorAdvances.find(a=>a.id===id);if(!x||!['Draft','Approval Reversed'].includes(x.status))return;x.status='Pending approval';x.approvalHistory=[...(x.approvalHistory||[]),{action:'Resubmitted',by:currentDirector,at:new Date().toISOString()}];render();toast('Request resubmitted for other-director approval.')}
function render(){let c=document.getElementById('content');c.innerHTML=currentPage==='Dashboard'?renderDashboard():currentPage==='Invoice Dashboard'?renderInvoiceDashboard():currentPage==='Expenses'?renderExpenses():currentPage==='Director Funds'?renderFunds():currentPage==='Director Advances'?renderDirectorAdvances():currentPage==='Expense Sheets'?renderSheets():currentPage==='Reimbursements'?renderReimbursements():currentPage==='Banking'?renderBanking():currentPage==='Transactions'?renderTransactions():currentPage==='Clients'?renderClients():currentPage==='Invoice Settings'?renderInvoiceSettings():currentPage==='Create Invoice'?renderCreateInvoice():currentPage==='Invoice Register'?renderInvoiceRegister():currentPage==='Client Payments'?renderClientPayments():currentPage==='Credit / Debit Notes'?renderCreditDebitNotes():currentPage==='Payroll'?renderPayroll():currentPage==='Vendors'?renderVendors():currentPage==='Settings'?renderSettings():currentPage==='Reports'?renderReports():renderSimple(currentPage);if(currentPage==='Create Invoice')calculateInvoice();c.querySelectorAll('.data-table tbody tr').forEach(row=>row.addEventListener('click',e=>{if(e.target.closest('button,a,input,select'))return;row.parentElement.querySelectorAll('tr').forEach(r=>r.classList.remove('selected'));row.classList.add('selected')}))}
function showModal(title,body,footer){modalDirty=false;discardPending=false;document.querySelector('#modalBackdrop .modal').classList.remove('invoice-detail-modal');document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalFooter').innerHTML=footer;document.getElementById('modalBackdrop').classList.add('show');}
function closeModal(force=false){
 if(!force && document.getElementById('modalTitle').textContent==='Add Expense' && modalDirty){
   confirmBox('Discard changes?','You have made changes to this expense. Do you want to discard them or continue editing?',()=>{discardPending=true;closeModal(true)},'Continue editing','Discard changes','danger');
   return;
 }
 document.getElementById('modalBackdrop').classList.remove('show');modalDirty=false;discardPending=false;
}
document.getElementById('modalBody').addEventListener('input',()=>{modalDirty=true});
document.getElementById('modalBody').addEventListener('change',()=>{modalDirty=true});
document.getElementById('modalClose').onclick=closeModal;document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
function openExpenseModal(){showModal('Add Expense',`<div class="form-grid">
<div class="form-field"><label>Expense Date *</label><input class="form-control" id="eDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
<div class="form-field"><label>Expense Category *</label><select class="form-control" id="eCategory"><option>Office Expenses</option><option>IT Equipment</option><option>Software & Cloud</option><option>Travel & Conveyance</option><option>Utilities</option><option>Professional Fees</option><option>Marketing</option><option>Other</option></select></div>
<div class="form-field"><label>Description *</label><input class="form-control" id="eDescription" placeholder="What was purchased or paid for?"></div>
<div class="form-field"><label>Vendor / Supplier</label><input class="form-control" id="eVendor" placeholder="Vendor name"></div>
<div class="form-field"><label>Invoice Number</label><input class="form-control" id="eInvoice" placeholder="Supplier invoice number"></div>
<div class="form-field"><label>Paid By *</label><select class="form-control" id="ePaidBy"><option>Company</option><option>Suryanarayana</option><option>Dinesan</option></select></div>
<div class="form-field"><label>Payment Mode</label><select class="form-control" id="eMode"><option>Bank Transfer</option><option>UPI</option><option>Card</option><option>Cash</option><option>Personal funds</option></select></div>
<div class="form-field"><label>Amount before GST (₹) *</label><input class="form-control" id="eAmount" type="number" min="0" step=".01" placeholder="0.00"></div>
<div class="form-field"><label>GST Applicable?</label><select class="form-control" id="eGstOn" onchange="document.getElementById('gstFields').style.display=this.value==='Yes'?'grid':'none'"><option>Yes</option><option>No</option></select></div>
<div class="form-field" id="gstFields"><label>GST Rate</label><select class="form-control" id="eGstRate"><option value="5">5%</option><option value="12">12%</option><option value="18" selected>18%</option><option value="28">28%</option><option value="0">0%</option></select></div>
<div class="form-field"><label>Supplier GSTIN</label><input class="form-control" id="eGstin" placeholder="15-character GSTIN"></div>
<div class="form-field"><label>ITC Eligibility</label><select class="form-control" id="eItc"><option>To be reviewed</option><option>Eligible</option><option>Ineligible</option><option>Partial</option></select></div>
<div class="form-field full"><label>Bill / Invoice Attachment</label><input class="form-control" id="eFile" type="file" accept=".pdf,.jpg,.jpeg,.png"></div>
<div class="form-field full"><label>Remarks</label><textarea class="form-control" id="eRemarks" rows="2" placeholder="Additional details"></textarea></div>
<div class="form-field full"><label class="check-row"><input type="checkbox" id="eAddClaim"> Add to a new expense sheet after recording</label></div></div><p style="font-size:10px;color:#778899;margin:16px 0 0">Prototype only: file selection is demonstrated locally; documents are not uploaded to R2.</p>`,
`<button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveExpense()">Save Expense</button>`)}
function saveExpense(){let desc=document.getElementById('eDescription').value.trim(),amount=Number(document.getElementById('eAmount').value);if(!desc||!amount||amount<=0){toast('Enter an expense description and a valid amount.','error');return}let gstOn=document.getElementById('eGstOn').value==='Yes',gst=gstOn?amount*Number(document.getElementById('eGstRate').value)/100:0;let paid=document.getElementById('ePaidBy').value;let id='EXP-'+String(expenses.length+1).padStart(4,'0');let date=new Date(document.getElementById('eDate').value+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});let item={id,date,description:desc,category:document.getElementById('eCategory').value,vendor:document.getElementById('eVendor').value||'—',paidBy:paid,amount,gst,status:paid==='Company'?'Recorded':'Unclaimed',invoice:document.getElementById('eInvoice').value||'—'};expenses.unshift(item);transactions.unshift({date,name:desc,type:'Expense recorded',ref:id,amount:-(amount+gst)});if(document.getElementById('eAddClaim').checked&&paid!=='Company'){sheets.unshift({id:'CLM-'+String(sheets.length+1).padStart(4,'0'),date,director:paid,items:1,total:amount+gst,status:'Draft'});}closeModal();render();toast('Expense recorded in the prototype.')}
function openFundModal(){showModal('Record Shareholder Contribution',`<div class="form-grid"><div class="form-field"><label>Deposit Date *</label><input class="form-control" id="fDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="form-field"><label>Director *</label><select class="form-control" id="fDirector"><option>Suryanarayana</option><option>Dinesan</option></select></div><div class="form-field"><label>Contribution Type</label><select class="form-control" id="fType"><option>Shareholder Capital</option></select></div><div class="form-field"><label>Amount (₹) *</label><input class="form-control" id="fAmount" type="number" min="0" placeholder="0.00"></div><div class="form-field"><label>Bank Reference</label><input class="form-control" id="fRef" placeholder="UTR / NEFT reference"></div><div class="form-field"><label>Payment Mode</label><select class="form-control" id="fMode"><option>Bank Transfer</option><option>Cheque</option><option>Other</option></select></div><div class="form-field full"><label>Deposit Proof</label><input class="form-control" type="file" accept=".pdf,.jpg,.jpeg,.png"></div></div><div class="note-box" style="margin-top:15px">Classification as share capital requires the relevant corporate approvals and statutory process. Confirm the treatment with your CA.</div>`,`<button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveFund()">Record Contribution</button>`)}
function saveFund(){let amount=Number(document.getElementById('fAmount').value);if(!amount||amount<=0){toast('Enter a valid contribution amount.','error');return}let director=document.getElementById('fDirector').value,date=new Date(document.getElementById('fDate').value+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});funds.unshift({date,director,type:'Shareholder Capital',amount,ref:document.getElementById('fRef').value||'—'});transactions.unshift({date,name:'Shareholder Capital – '+director,type:'Director contribution',ref:'FND-'+String(funds.length).padStart(4,'0'),amount});closeModal();render();toast('Contribution recorded in the prototype.')}
function openSheetModal(){let eligible=expenses.filter(e=>e.paidBy!=='Company'&&!sheets.some(s=>s.status!=='Rejected'&&s.expenseIds&&s.expenseIds.includes(e.id)));showModal('Create Expense Sheet',`<div class="form-grid"><div class="form-field"><label>Submitted By *</label><select class="form-control" id="sDirector"><option>Suryanarayana</option><option>Dinesan</option></select></div><div class="form-field"><label>Submission Date</label><input class="form-control" type="date" id="sDate" value="${new Date().toISOString().slice(0,10)}"></div><div class="form-field full"><label>Select recorded personal expenses</label><div style="border:1px solid #dce5ed;border-radius:8px;padding:10px;max-height:220px;overflow:auto">${eligible.length?eligible.map(e=>`<label class="check-row" style="padding:8px 0;border-bottom:1px solid #edf1f4"><input type="checkbox" name="sheetExpense" value="${e.id}"><span style="flex:1">${e.description} · ${e.paidBy}</span><b>${money(e.amount+e.gst)}</b></label>`).join(''):'<span style="color:#718096;font-size:12px">No unclaimed personal expenses are currently available.</span>'}</div></div><div class="form-field full"><label>Additional remarks</label><textarea class="form-control" rows="2" id="sRemarks"></textarea></div></div><div class="note-box" style="margin-top:14px">The other director will review this claim. You cannot approve your own expense sheet.</div>`,`<button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveSheet()">Submit Expense Sheet</button>`)}
function saveSheet(){let ids=[...document.querySelectorAll('input[name="sheetExpense"]:checked')].map(x=>x.value);if(!ids.length){toast('Select at least one expense.','error');return}let director=document.getElementById('sDirector').value;if(ids.some(id=>expenses.find(e=>e.id===id).paidBy!==director)){toast('Select only expenses paid by the submitting director.','error');return}let selected=expenses.filter(e=>ids.includes(e.id)),total=selected.reduce((a,e)=>a+e.amount+e.gst,0),date=new Date(document.getElementById('sDate').value+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}),id='CLM-'+String(sheets.length+1).padStart(4,'0');sheets.unshift({id,date,director,items:selected.length,total,status:'Pending approval',expenseIds:ids});selected.forEach(e=>e.status='Claim pending');closeModal();render();toast('Expense sheet submitted for other-director approval.')}
function approveSheet(id){let s=sheets.find(x=>x.id===id);if(!s)return;let reviewer=s.director==='Suryanarayana'?'Dinesan':'Suryanarayana';if(currentDirector===s.director){confirmBox('Self-approval is not allowed',`This claim was submitted by ${s.director}. Only the other director (${reviewer}) can approve it.`,()=>{});return}confirmBox('Approve expense claim?',`Approve ${id} for ${money(s.total)}? This action will mark the claim as approved.`,()=>{s.status='Approved – Payment Pending';s.approvedBy=currentDirector;s.approvalHistory=[...(s.approvalHistory||[]),{action:'Approved',by:currentDirector,at:new Date().toISOString()}];(s.expenseIds||[]).forEach(eid=>{let e=expenses.find(x=>x.id===eid);if(e)e.status='Claim approved'});render();toast('Expense claim approved.')})}
function viewExpense(id){let e=expenses.find(x=>x.id===id);if(!e)return;showModal('Expense Details',`<div class="form-grid view-grid"><div><small>Expense Number</small><div class="main-text">${e.id}</div></div><div><small>Expense Date</small><div class="main-text">${e.date}</div></div><div><small>Description</small><div class="main-text">${e.description}</div></div><div><small>Category</small><div class="main-text">${e.category}</div></div><div><small>Vendor</small><div class="main-text">${e.vendor}</div></div><div><small>Paid By</small><div class="main-text">${e.paidBy}</div></div><div><small>Invoice</small><div class="main-text">${e.invoice}</div></div><div><small>Status</small>${badge(e.status)}</div><div><small>Taxable Amount</small><div class="main-text">${money(e.amount)}</div></div><div><small>GST</small><div class="main-text">${money(e.gst)}</div></div><div><small>Gross Total</small><div class="main-text">${money(e.amount+e.gst)}</div></div></div>`,`<button class="btn btn-light" onclick="closeModal()">Close</button>`)}
function confirmBox(title,message,action,cancelLabel='Cancel',proceedLabel='Confirm',proceedStyle='primary'){
 confirmAction=action;
 document.getElementById('confirmTitle').textContent=title;
 document.getElementById('confirmMessage').textContent=message;
 document.getElementById('confirmCancel').textContent=cancelLabel;
 document.getElementById('confirmProceed').textContent=proceedLabel;
 document.getElementById('confirmProceed').className='btn '+(proceedStyle==='danger'?'btn-danger':'btn-primary');
 document.getElementById('confirmBackdrop').classList.add('show');
}
function closeConfirm(){document.getElementById('confirmBackdrop').classList.remove('show');confirmAction=null}
document.getElementById('confirmClose').onclick=closeConfirm;document.getElementById('confirmCancel').onclick=closeConfirm;document.getElementById('confirmProceed').onclick=()=>{let a=confirmAction;closeConfirm();if(a)a()};
document.getElementById('signOut').onclick=()=>confirmBox('Sign out?','You will be signed out of Navodix and returned to the central login page.',()=>window.navodixAccountsSignOut(),'Stay signed in','Sign out','danger');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('confirmBackdrop').classList.contains('show'))closeConfirm();else if(document.getElementById('modalBackdrop').classList.contains('show'))closeModal();else document.getElementById('sidebar').classList.remove('open')}});

const appRoot=document.querySelector('.app');
appRoot.style.display='none';
function showApplication(){document.getElementById('accountsAuthLoading').style.display='none';appRoot.style.display='grid';render();}
window.navodixAccountsAuthReady.then(showApplication).catch(function(){document.getElementById('accountsAuthLoading').textContent='Redirecting to secure sign-in…';});
