<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Admin Login | Navodix IT Solutions</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css?v=27">
  <style>
    /* Login-page-only styling matching the approved Navodix login design. */
    body.admin-login-page {
      --login-navy: #082d68;
      --login-blue: #0755ed;
      --login-sky: #dcecff;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--login-navy);
      background:
        radial-gradient(ellipse at 50% 54%, rgba(255,255,255,.98) 0%, rgba(255,255,255,.68) 28%, transparent 55%),
        radial-gradient(ellipse at 6% 8%, rgba(255,255,255,.78) 0%, transparent 36%),
        linear-gradient(135deg, #dceaff 0%, #b9d9ff 48%, #d9eaff 100%);
    }
    body.admin-login-page::before,
    body.admin-login-page::after {
      content: "";
      position: fixed;
      pointer-events: none;
      z-index: 0;
      border-radius: 50%;
    }
    body.admin-login-page::before {
      width: 112vw; height: 74vw; min-height: 640px;
      left: -26vw; top: -44vw;
      border: 1px solid rgba(255,255,255,.45);
      background: linear-gradient(145deg, rgba(255,255,255,.42), rgba(72,157,255,.22));
      transform: rotate(17deg);
      box-shadow: 0 0 0 70px rgba(255,255,255,.12), 0 0 0 150px rgba(71,151,255,.09);
    }
    body.admin-login-page::after {
      width: 780px; height: 780px; right: -350px; bottom: -500px;
      background: linear-gradient(145deg, rgba(255,255,255,.55), rgba(52,143,255,.18));
      border: 1px solid rgba(255,255,255,.48);
    }
    .admin-login-page .login-shell {
      position: relative;
      z-index: 1;
      box-sizing: border-box;
      min-height: 100vh;
      width: 75%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 34px 20px;
      isolation: isolate;
    }
    .admin-login-page .login-shell::before,
    .admin-login-page .login-shell::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 120px; height: 120px;
      background-image: radial-gradient(circle, rgba(45,139,255,.38) 2.4px, transparent 2.8px);
      background-size: 25px 25px;
      pointer-events: none;
    }
    .admin-login-page .login-shell::before { top: 22px; right: 20px; }
    .admin-login-page .login-shell::after { bottom: 20px; left: 20px; }
    .admin-login-page .login-card {
      position: relative;
      box-sizing: border-box;
      width: min(100%, 390px);
      padding: 18px 28px 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.95);
      border-radius: 16px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 22px 60px rgba(31,103,183,.18), 0 0 0 1px rgba(70,151,255,.08);
    }
    .admin-login-page .login-card::before {
      content: "";
      position: absolute;
      z-index: 0;
      top: 0; left: 0; right: 0;
      height: 94px;
      background:
        radial-gradient(ellipse at 52% 92%, rgba(255,255,255,.88) 0 27%, transparent 28%),
        linear-gradient(143deg, transparent 0 44%, rgba(255,255,255,.46) 44.2% 62%, transparent 62.2%),
        linear-gradient(32deg, transparent 0 53%, rgba(255,255,255,.34) 53.2% 67%, transparent 67.2%),
        linear-gradient(135deg, #3696ff 0%, #c4e4ff 44%, #63b9ff 100%);
      clip-path: ellipse(100% 100% at 50% 0%);
    }
    .admin-login-page .login-brand,
    .admin-login-page .login-heading,
    .admin-login-page .login-form,
    .admin-login-page .login-footer { position: relative; z-index: 1; }
    .admin-login-page .login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 0 10px;
      min-height: 38px;
    }
    .admin-login-page .login-brand a { display: inline-flex; align-items: center; justify-content: center; }
    .admin-login-page .login-brand img {
      display: block;
      width: min(100%, 205px);
      max-height: 38px;
      object-fit: contain;
    }
    .admin-login-page .login-heading { text-align: center; margin: 0 0 12px; }
    .admin-login-page .section-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 23px;
      box-sizing: border-box;
      padding: 4px 10px;
      border-radius: 999px;
      background: #dceaff;
      color: #0755ed;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.1px;
    }
    .admin-login-page .login-heading h1 {
      margin: 8px 0 5px;
      color: #082b63;
      font-size: clamp(20px, 2.2vw, 24px);
      line-height: 1.15;
      font-weight: 750;
      letter-spacing: -.5px;
    }
    .admin-login-page .login-heading p {
      max-width: 310px;
      margin: 0 auto;
      color: #526b91;
      font-size: 12px;
      line-height: 1.35;
    }
    .admin-login-page .login-form { display: flex; flex-direction: column; gap: 9px; }
    .admin-login-page .field-group { display: flex; flex-direction: column; gap: 5px; }
    .admin-login-page .field-group label {
      color: #082b63;
      font-size: 10px;
      font-weight: 750;
    }
    .admin-login-page .input-wrap {
      display: flex;
      align-items: center;
      box-sizing: border-box;
      height: 32px;
      padding: 0 10px;
      gap: 0;
      border: 1.5px solid #c6ddff;
      border-radius: 8px;
      background: #edf5ff;
      box-shadow: inset 0 1px 2px rgba(22,73,137,.025);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .admin-login-page .input-wrap:focus-within {
      border-color: #4b9bff;
      box-shadow: 0 0 0 3px rgba(53,143,255,.13);
    }
    .admin-login-page .input-wrap > i { display: none; }
    .admin-login-page .input-wrap input {
      flex: 1;
      min-width: 0;
      height: 100%;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #111827;
      font: 12px "Segoe UI", Arial, sans-serif;
      box-shadow: none;
    }
    .admin-login-page .input-wrap input::placeholder { color: #8194ad; }
    .admin-login-page .password-toggle {
      flex: 0 0 20px;
      width: 20px;
      height: 26px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #718cac;
      cursor: pointer;
      font-size: 13px;
    }
    .admin-login-page #loginButton {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      box-sizing: border-box;
      width: 100%;
      min-height: 34px;
      margin-top: 0;
      border: 1px solid #0755ed;
      border-radius: 8px;
      background: linear-gradient(105deg, #168bf4 0%, #0757ed 56%, #0739e5 100%);
      box-shadow: 0 8px 18px rgba(0,83,230,.18);
      color: #fff;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      transition: filter .15s ease, transform .15s ease;
    }
    .admin-login-page #loginButton:hover { filter: brightness(1.04); }
    .admin-login-page #loginButton:active { transform: translateY(1px); }
    .admin-login-page .login-message:empty { display: none; }
    .admin-login-page .login-message { margin-top: -10px; font-size: 13px; }
    .admin-login-page .login-footer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #d8e5f7;
      text-align: center;
    }
    .admin-login-page .login-footer a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: #0755ed;
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
    }
    .admin-login-page .login-footer a:hover { text-decoration: underline; }
    .admin-login-page .login-footer a i { font-size: 12px; }
    @media (max-width: 600px) {
      .admin-login-page .login-shell { width: 75%; min-width: 0; padding: 14px 0; }
      .admin-login-page .login-card { width: 100%; padding: 16px 18px 12px; border-radius: 12px; }
      .admin-login-page .login-card::before { height: 86px; }
      .admin-login-page .login-brand { margin-bottom: 9px; min-height: 34px; }
      .admin-login-page .login-brand img { width: min(100%, 180px); max-height: 34px; }
      .admin-login-page .section-badge { min-height: 21px; font-size: 9px; padding: 3px 9px; }
      .admin-login-page .login-heading h1 { font-size: 20px; margin-top: 7px; }
      .admin-login-page .login-heading p { font-size: 11px; }
      .admin-login-page .login-form { gap: 8px; }
      .admin-login-page .field-group label { font-size: 10px; }
      .admin-login-page .input-wrap { height: 30px; }
      .admin-login-page .input-wrap input { font-size: 11px; }
      .admin-login-page #loginButton { min-height: 32px; font-size: 11px; }
      .admin-login-page .login-footer { margin-top: 10px; padding-top: 8px; }
      .admin-login-page .login-footer a { font-size: 10px; }
    }
  </style>
</head>
<body class="admin-login-page">
  <main class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <a href="../index.html" aria-label="Navodix IT Solutions home">
          <img src="../assets/images/logo.png?v=16" alt="Navodix IT Solutions">
        </a>
      </div>

      <div class="login-heading">
        <span class="section-badge">CAREERS ADMIN</span>
        <h1>Admin Login</h1>
        <p>Sign in to manage Navodix career opportunities and applications.</p>
      </div>

      <form id="loginForm" class="login-form" novalidate>
        <div class="field-group">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <input id="email" name="email" type="email" autocomplete="username" placeholder="Enter admin email" required>
          </div>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
            <button class="password-toggle" id="passwordToggle" type="button" aria-label="Show password" aria-pressed="false">
              <i class="fa-solid fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <button class="btn btn-primary btn-block" id="loginButton" type="submit">
          <span id="loginButtonText">Sign In</span>
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </button>

        <div class="login-message" id="loginMessage" role="alert" aria-live="polite"></div>
      </form>

      <div class="login-footer">
        <a href="../index.html"><i class="fa-solid fa-globe" aria-hidden="true"></i> Go to Navodix website</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=16"></script>
  <script src="js/supabase-client.js?v=16"></script>
  <script src="js/auth.js?v=16"></script>
</body>
</html>
