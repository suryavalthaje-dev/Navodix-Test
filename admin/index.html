<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Admin Login | Navodix IT Solutions</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css?v=20">
</head>
<body class="admin-login-page">
  <main class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <a href="../index.html" aria-label="Navodix IT Solutions home">
          <img src="../assets/images/logo.png?v=16" alt="Navodix IT Solutions">
        </a>
      </div>

      <div class="login-heading">
        <span class="section-badge">CAREERS ADMIN</span>
        <h1>Admin Login</h1>
        <p>Sign in to manage Navodix career opportunities and applications.</p>
      </div>

      <form id="loginForm" class="login-form" novalidate>
        <div class="field-group">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope" aria-hidden="true"></i>
            <input id="email" name="email" type="email" autocomplete="username" placeholder="Enter admin email" required>
          </div>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
            <button class="password-toggle" id="passwordToggle" type="button" aria-label="Show password" aria-pressed="false">
              <i class="fa-solid fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <button class="btn btn-primary btn-block" id="loginButton" type="submit">
          <span id="loginButtonText">Sign In</span>
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </button>

        <div class="login-message" id="loginMessage" role="alert" aria-live="polite"></div>
      </form>

      <div class="login-footer">
        <a href="../index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Navodix website</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=16"></script>
  <script src="js/supabase-client.js?v=16"></script>
  <script src="js/auth.js?v=16"></script>
</body>
</html>
