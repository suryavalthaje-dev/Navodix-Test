<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Set Password | Navodix Careers Admin</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css?v=18">
  <style>
    .password-card { width: min(500px, 100%); }
    .password-help { color: var(--text-muted); font-size: 12px; margin-top: 7px; }
    .password-message { min-height: 22px; margin-top: 13px; font-size: 13px; }
    .password-message.error { color: #B42318; }
    .password-message.success { color: #067647; }
    .password-status { margin-bottom: 18px; padding: 11px 13px; border-radius: 9px; background: #F3F7FB; color: var(--text-muted); font-size: 12px; }
  </style>
</head>
<body class="admin-login-page">
  <main class="login-shell">
    <div class="login-card password-card">
      <div class="login-brand">
        <a href="../index.html" aria-label="Navodix IT Solutions home">
          <img src="../assets/images/logo.png?v=18" alt="Navodix IT Solutions">
        </a>
      </div>

      <div class="login-heading">
        <span class="section-badge">CAREERS ADMIN</span>
        <h1>Set Your Password</h1>
        <p>Complete your Navodix Careers Admin account setup.</p>
      </div>

      <div id="passwordStatus" class="password-status">Checking your invitation link…</div>

      <form id="setPasswordForm" class="login-form hidden" novalidate>
        <div class="field-group">
          <label for="newPassword">New Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
            <input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Enter a new password" required>
            <button class="password-toggle" id="newPasswordToggle" type="button" aria-label="Show password" aria-pressed="false">
              <i class="fa-solid fa-eye" aria-hidden="true"></i>
            </button>
          </div>
          <div class="password-help">Use at least 8 characters.</div>
        </div>

        <div class="field-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
            <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Re-enter your password" required>
          </div>
        </div>

        <button class="btn btn-primary btn-block" id="setPasswordButton" type="submit">
          <span id="setPasswordButtonText">Set Password &amp; Continue</span>
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </button>

        <div id="passwordMessage" class="password-message" role="alert" aria-live="polite"></div>
      </form>

      <div class="login-footer">
        <a href="index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Admin Login</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=18"></script>
  <script src="js/supabase-client.js?v=18"></script>
  <script>
    (function () {
      'use strict';

      const supabaseClient = window.navodixSupabase;
      const form = document.getElementById('setPasswordForm');
      const status = document.getElementById('passwordStatus');
      const message = document.getElementById('passwordMessage');
      const button = document.getElementById('setPasswordButton');
      const buttonText = document.getElementById('setPasswordButtonText');

      function setMessage(text, type) {
        message.textContent = text || '';
        message.className = 'password-message' + (type ? ' ' + type : '');
      }

      function setupToggle(toggleId, inputId) {
        const toggle = document.getElementById(toggleId);
        const input = document.getElementById(inputId);
        if (!toggle || !input) return;
        toggle.addEventListener('click', function () {
          const showing = input.type === 'text';
          input.type = showing ? 'password' : 'text';
          toggle.setAttribute('aria-pressed', String(!showing));
          toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
          const icon = toggle.querySelector('i');
          if (icon) icon.className = showing ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
        });
      }

      async function initialize() {
        if (!supabaseClient) {
          status.textContent = 'The authentication service could not be initialized.';
          return;
        }

        try {
          const { data, error } = await supabaseClient.auth.getSession();
          if (error) throw error;

          if (!data?.session) {
            status.textContent = 'This invitation link is invalid, expired, or no longer active. Please ask an Admin to send a new invitation.';
            return;
          }

          const email = data.session.user?.email || '';
          status.textContent = email
            ? `Invitation verified for ${email}. Please create your password below.`
            : 'Invitation verified. Please create your password below.';
          form.classList.remove('hidden');
          setupToggle('newPasswordToggle', 'newPassword');
          document.getElementById('newPassword')?.focus();
        } catch (error) {
          console.error('Invitation verification failed:', error);
          status.textContent = error?.message || 'Unable to verify the invitation.';
        }
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        setMessage('', '');

        const password = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;

        if (password.length < 8) {
          setMessage('Password must be at least 8 characters.', 'error');
          return;
        }

        if (password !== confirm) {
          setMessage('The passwords do not match.', 'error');
          return;
        }

        button.disabled = true;
        buttonText.textContent = 'Saving Password…';

        try {
          const { error } = await supabaseClient.auth.updateUser({ password });
          if (error) throw error;

          setMessage('Password set successfully. Opening Careers Admin…', 'success');
          setTimeout(function () {
            window.location.replace('manage-jobs.html');
          }, 700);
        } catch (error) {
          console.error('Password setup failed:', error);
          setMessage(error?.message || 'Unable to set your password. Please try again.', 'error');
          button.disabled = false;
          buttonText.textContent = 'Set Password & Continue';
        }
      });

      initialize();
    })();
  </script>
</body>
</html>
